<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>تطبيق إدارة الأعلاف اليومي | Feed Manager Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', 'Tahoma', 'Cairo', sans-serif;
    }

    body {
      background-color: #0a0c10;
      color: #eef2ff;
      padding: 1rem;
      transition: all 0.2s ease;
    }

    .app-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .dashboard-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 15px;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #2a2e3a;
    }
    .title-section h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff9f4a, #ff7a2f);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }
    .title-section p {
      color: #9ca3af;
      font-size: 0.85rem;
      margin-top: 5px;
    }
    .action-buttons {
      display: flex;
      gap: 12px;
    }
    .btn-primary {
      background: #ff7a2f;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      color: #0a0c10;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(255, 122, 47, 0.2);
    }
    .btn-primary:hover {
      background: #ff9330;
      transform: scale(0.97);
      box-shadow: 0 2px 6px rgba(255, 122, 47, 0.3);
    }
    .btn-secondary {
      background: #252a34;
      border: 1px solid #3f4656;
      color: #e2e8f0;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-secondary:hover {
      background: #2f3542;
    }
    /* زر الواتس اب مميز */
    .btn-whatsapp {
      background: #075e54;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn-whatsapp:hover {
      background: #128C7E;
      transform: scale(0.97);
    }

    .search-bar {
      margin-bottom: 2rem;
    }
    .search-input {
      width: 100%;
      background: #14181f;
      border: 1px solid #2c313c;
      border-radius: 60px;
      padding: 14px 24px;
      font-size: 1rem;
      color: #f1f5f9;
      outline: none;
      transition: 0.2s;
    }
    .search-input:focus {
      border-color: #ff7a2f;
      box-shadow: 0 0 0 2px rgba(255, 122, 47, 0.2);
    }

    /* حاوية الفرع وارسال */
    .branch-send-section {
      background: #13161e;
      border-radius: 32px;
      padding: 0.8rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      border: 1px solid #282e38;
    }
    .branch-input-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: #0c0f15;
      padding: 5px 20px;
      border-radius: 60px;
    }
    .branch-input-group label {
      font-weight: 500;
      color: #ffa05e;
    }
    #branchNameInput {
      background: transparent;
      border: none;
      padding: 12px 0;
      font-size: 1rem;
      color: white;
      outline: none;
      width: 180px;
    }
    #branchNameInput::placeholder {
      color: #5f6c7a;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.8rem;
      margin-top: 1rem;
    }

    .product-card {
      background: #13161e;
      border-radius: 32px;
      border: 1px solid #282e38;
      padding: 1.3rem 1.5rem;
      transition: all 0.25s ease;
      box-shadow: 0 12px 20px -12px rgba(0, 0, 0, 0.4);
    }
    .product-card:hover {
      border-color: #ff7a2f50;
      transform: translateY(-3px);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      border-bottom: 1px dashed #2a2e3a;
      padding-bottom: 0.5rem;
    }
    .product-name {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(145deg, #fff, #ffb47b);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .bag-weight-badge {
      background: #1e293b;
      padding: 5px 12px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #ffa05e;
      border-left: 2px solid #ff7a2f;
    }

    .input-group {
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .input-group label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #b9c3d4;
      letter-spacing: 0.3px;
    }
    .number-input {
      background: #0c0f15;
      border: 1px solid #2b313d;
      border-radius: 28px;
      padding: 14px 18px;
      font-size: 1.2rem;
      font-weight: 500;
      color: #facc15;
      width: 100%;
      outline: none;
      transition: 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }
    .number-input:focus {
      border-color: #ff7a2f;
      box-shadow: 0 0 0 2px rgba(255, 122, 47, 0.3);
    }

    .results {
      background: #0b0e14;
      border-radius: 28px;
      padding: 16px;
      margin: 1rem 0;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 12px;
    }
    .result-item {
      display: flex;
      flex-direction: column;
    }
    .result-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #7e8a98;
    }
    .result-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffb347;
      line-height: 1.2;
    }
    .decimal-bags {
      color: #4ade80;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 12px;
    }
    .icon-btn {
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #9aa3b5;
      transition: 0.2s;
      padding: 8px 12px;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }
    .icon-btn.edit-btn {
      color: #60a5fa;
    }
    .icon-btn.edit-btn:hover {
      background: #1e2a3e;
      color: #93c5fd;
    }
    .icon-btn.delete-btn {
      color: #f87171;
    }
    .icon-btn.delete-btn:hover {
      background: #2c1a1f;
      color: #ff8a8a;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: #171c24;
      border-radius: 48px;
      padding: 2rem;
      width: 90%;
      max-width: 450px;
      border: 1px solid #ff7a2f55;
    }
    .modal-content h3 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .modal input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      background: #0f1219;
      border: 1px solid #2f3643;
      border-radius: 40px;
      color: white;
      font-size: 1rem;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .save-modal {
      background: #ff7a2f;
      border: none;
      padding: 12px;
      border-radius: 60px;
      font-weight: bold;
      cursor: pointer;
    }

    .splash {
      position: fixed;
      inset: 0;
      background: #0a0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      transition: opacity 0.7s ease;
      flex-direction: column;
      gap: 20px;
    }
    .splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .splash-logo {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff9f4a, #ff5e1a);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    @media (max-width: 640px) {
      .products-grid {
        grid-template-columns: 1fr;
      }
      .result-value {
        font-size: 1.3rem;
      }
      .product-name {
        font-size: 1.2rem;
      }
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.7rem;
      color: #4a5568;
    }
  </style>
</head>
<body>

<div class="splash" id="splashScreen">
  <div class="splash-logo">🐓 FeedMaster Pro</div>
  <div style="color:#ffa05e;">نظام المحاسبة اليومي للأعلاف</div>
  <div style="font-size:0.8rem;">باقات | كيلو فارط | حسابات فورية</div>
  <button class="btn-primary" id="closeSplashBtn" style="margin-top:20px;">ابدأ العمل ➡️</button>
</div>

<div class="app-container">
  <div class="dashboard-header">
    <div class="title-section">
      <h1>📍 مدير الأعلاف الذكي</h1>
      <p>حساب الأكياس + الكيلو فارط • تحويل فوري إلى كيلو والعدد عشري</p>
    </div>
    <div class="action-buttons">
      <button class="btn-primary" id="addProductBtn">➕ إضافة منتج جديد</button>
      <button class="btn-secondary" id="resetQuantitiesBtn">🔄 إعادة تعيين الكميات</button>
    </div>
  </div>

  <!-- قسم الفرع وإرسال الواتساب -->
  <div class="branch-send-section">
    <div class="branch-input-group">
      <label>🏢 الفرع:</label>
      <input type="text" id="branchNameInput" placeholder="مثال: فرع المنصورة" autocomplete="off">
    </div>
    <button class="btn-whatsapp" id="sendWhatsAppBtn">📲 إرسال التقرير إلى الواتساب</button>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 بحث باسم العلف أو الوزن ...">
  </div>

  <div id="productsContainer" class="products-grid"></div>
  <footer>✓ يتم الحفظ التلقائي • أدخل عدد الأكياس والكيلو الفارط • تحسب الاجمالي وعدد الأكياس العشري تلقائياً</footer>
</div>

<div id="productModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">إضافة منتج جديد</h3>
    <input type="text" id="productNameInput" placeholder="اسم العلف (مثال: حبوب تسمين)" autocomplete="off">
    <input type="text" id="productWeightInput" placeholder="وزن الكيس (كجم)" value="50" autocomplete="off">
    <div class="modal-buttons">
      <button id="modalSaveBtn" class="save-modal">💾 حفظ</button>
      <button id="modalCancelBtn" class="btn-secondary">إلغاء</button>
    </div>
  </div>
</div>

<script>
  // Default Products (نفس البيانات مع ضمان وجود id فريد)
  const DEFAULT_PRODUCTS = [
    { id: 'p1', name: 'بادي', bagWeight: 50, bags: 0, looseKg: 0 },
    { id: 'p2', name: 'نامي', bagWeight: 50, bags: 0, looseKg: 0 },
    { id: 'p3', name: 'ناهي', bagWeight: 50, bags: 0, looseKg: 0 },
    { id: 'p4', name: 'بياض', bagWeight: 50, bags: 0, looseKg: 0 },
    { id: 'p5', name: 'ذهبي', bagWeight: 50, bags: 0, looseKg: 0 },
    { id: 'p6', name: 'قمح', bagWeight: 50, bags: 0, looseKg: 0 },
    { id: 'p7', name: 'عويقه', bagWeight: 50, bags: 0, looseKg: 0 },
    { id: 'p8', name: 'مواشي تسمين', bagWeight: 50, bags: 0, looseKg: 0 },
    { id: 'p9', name: 'ارانب تسمين', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p10', name: 'ارانب مرضعات', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p11', name: 'كسر فول', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p12', name: 'فول صحيح', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p13', name: 'بسله', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p14', name: 'دكتور مينا', bagWeight: 20, bags: 0, looseKg: 0 },
    { id: 'p15', name: 'رمايه سوبر', bagWeight: 20, bags: 0, looseKg: 0 },
    { id: 'p16', name: 'رمايه عادي', bagWeight: 20, bags: 0, looseKg: 0 },
    { id: 'p17', name: 'اسكندريه', bagWeight: 20, bags: 0, looseKg: 0 },
    { id: 'p18', name: 'ردة', bagWeight: 40, bags: 0, looseKg: 0 },
    { id: 'p19', name: 'ابناء الشرقيه', bagWeight: 40, bags: 0, looseKg: 0 },
    { id: 'p20', name: 'المراعي', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p21', name: 'علف بط', bagWeight: 50, bags: 0, looseKg: 0 },
    { id: 'p22', name: 'ذهبي صغير', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p23', name: 'بادي صغير', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p24', name: 'نامي صغير', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p25', name: 'ناهي صغير', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p26', name: 'بياض صغير', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p27', name: 'دشيشه صغير', bagWeight: 25, bags: 0, looseKg: 0 },
    { id: 'p28', name: 'دشيشه', bagWeight: 50, bags: 0, looseKg: 0 }, 
    { id: 'p29', name: 'شعير', bagWeight: 50, bags: 0, looseKg: 0 }
  ];

  let products = [];

  function loadProductsFromStorage() {
    const stored = localStorage.getItem('feed_manager_products');
    if (stored) {
      try {
        let parsed = JSON.parse(stored);
        if (Array.isArray(parsed) && parsed.length) {
          products = parsed;
          return;
        }
      } catch(e) {}
    }
    products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
    products.forEach(p => {
      if (p.bags === undefined) p.bags = 0;
      if (p.looseKg === undefined) p.looseKg = 0;
      if (!p.id) p.id = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random();
    });
    saveToLocalStorage();
  }

  

  // دالة إنشاء نص التقرير للواتساب
  function generateWhatsAppMessage() {
    let branchName = document.getElementById('branchNameInput').value.trim();
    if (branchName === "") branchName = "فرع غير محدد";
    
    const now = new Date();
    const dateStr = `${now.toLocaleDateString('ar-EG')} ${now.toLocaleTimeString('ar-EG')}`;
    
    let message = `📊 *تقرير الأعلاف اليومي* 📊\n`;
    message += `🏢 *الفرع:* ${branchName}\n`;
    message += `🕒 *التاريخ والوقت:* ${dateStr}\n`;
    message += `━━━━━━━━━━━━━━━━━━━━\n`;
    
    // تصفية المنتجات التي لها كميات فقط
    const nonZeroProducts = products.filter(p => (p.bags && p.bags > 0) || (p.looseKg && p.looseKg > 0));
    
    if (nonZeroProducts.length === 0) {
      message += `⚠️ لا توجد كميات مسجلة اليوم.\n`;
    } else {
      nonZeroProducts.forEach(p => {
        const bagWeight = p.bagWeight;
        const bags = p.bags || 0;
        const loose = p.looseKg || 0;
        const totalKg = (bags * bagWeight) + loose;
        const decimalBags = bagWeight > 0 ? totalKg / bagWeight : 0;
        const decimalFormatted = decimalBags % 1 === 0 ? decimalBags.toFixed(0) : decimalBags.toFixed(2);
        
        message += `🔸 *${p.name}* (${bagWeight} كجم/كيس)\n`;
        message += `   📦 أكياس: ${bags}  |  ⚖️ كيلو فارط: ${loose} كجم\n`;
        message += `   📈 الإجمالي: ${Math.round(totalKg * 10) / 10} كجم  |  🛍️ أكياس عشرية: ${decimalFormatted}\n`;
        message += `━━━━━━━━━━━━━━━━━━━━\n`;
      });
    }
    
    // إضافة إجمالي عام لكل الكميات
    let totalAllKg = 0;
    let totalAllDecimalBags = 0;
    products.forEach(p => {
      const totalKg = ((p.bags || 0) * p.bagWeight) + (p.looseKg || 0);
      totalAllKg += totalKg;
      if(p.bagWeight > 0) totalAllDecimalBags += totalKg / p.bagWeight;
    });
    message += `📌 *المجموع الكلي:* ${Math.round(totalAllKg * 10) / 10} كجم\n`;
    message += `📌 *إجمالي الأكياس العشرية:* ${(totalAllDecimalBags % 1 === 0) ? totalAllDecimalBags.toFixed(0) : totalAllDecimalBags.toFixed(2)} كيس\n`;
    message += `\n✅ تم الإرسال عبر تطبيق FeedMaster Pro`;
    
    return encodeURIComponent(message);
  }

  // وظيفة إرسال الواتساب
  function sendWhatsAppReport() {
    const phoneNumber = "+201015913800"; // رقم المستلم
    const message = generateWhatsAppMessage();
    const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;
    window.open(whatsappUrl, '_blank');
  }

  // باقي دوال التطبيق
  function updateSingleProductUI(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    
    const card = document.querySelector(`.product-card[data-product-id="${productId}"]`);
    if (!card) return;
    
    const bagWeight = product.bagWeight;
    const bags = product.bags || 0;
    const looseKg = product.looseKg || 0;
    const totalKg = (bags * bagWeight) + looseKg;
    const decimalBags = bagWeight > 0 ? totalKg / bagWeight : 0;
    const decimalBagsFormatted = decimalBags % 1 === 0 ? decimalBags.toFixed(0) : decimalBags.toFixed(2);
    
    const bagsInput = card.querySelector('.bags-input');
    const looseInput = card.querySelector('.loose-input');
    
    if (bagsInput && document.activeElement !== bagsInput) {
      bagsInput.value = bags;
    }
    if (looseInput && document.activeElement !== looseInput) {
      looseInput.value = looseKg;
    }
    
    const totalKgSpan = card.querySelector('.result-total-kg');
    const decimalBagsSpan = card.querySelector('.result-decimal-bags');
    
    if (totalKgSpan) totalKgSpan.textContent = `${Math.round(totalKg * 10) / 10} كجم`;
    if (decimalBagsSpan) decimalBagsSpan.textContent = `${decimalBagsFormatted} كيس`;
  }

  function updateProductQuantity(productId, field, value) {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    
    let num = parseFloat(value);
    if (isNaN(num)) num = 0;
    if (num < 0) num = 0;
    
    if (field === 'bags') {
      product.bags = num;
    } else if (field === 'loose') {
      product.looseKg = num;
    }
    


  let currentEditProductId = null;

  function openAddModal() {
    currentEditProductId = null;
    document.getElementById('modalTitle').innerText = '➕ إضافة علف جديد';
    document.getElementById('productNameInput').value = '';
    document.getElementById('productWeightInput').value = '50';
    document.getElementById('productModal').style.display = 'flex';
  }

  function openEditModal(productId) {
    const prod = products.find(p => p.id === productId);
    if (!prod) return;
    currentEditProductId = productId;
    document.getElementById('modalTitle').innerText = '✏️ تعديل المنتج';
    document.getElementById('productNameInput').value = prod.name;
    document.getElementById('productWeightInput').value = prod.bagWeight;
    document.getElementById('productModal').style.display = 'flex';
  }

  function deleteProductById(productId) {
    if (products.length <= 1) {
      alert("لا يمكن حذف آخر منتج، يمكنك تعديله بدلاً من ذلك.");
      return;
    }
    products = products.filter(p => p.id !== productId);
    saveToLocalStorage();
    renderProducts();
  }

  function saveProductFromModal() {
    let name = document.getElementById('productNameInput').value.trim();
    let weightRaw = document.getElementById('productWeightInput').value;
    let weight = parseFloat(weightRaw);
    
    if (!name || name === "") {
      alert("الرجاء إدخال اسم العلف");
      return;
    }
    if (isNaN(weight) || weight <= 0) {
      alert("وزن الكيس يجب أن يكون رقماً موجباً");
      return;
    }
    
    if (currentEditProductId) {
      const index = products.findIndex(p => p.id === currentEditProductId);
      if (index !== -1) {
        products[index].name = name;
        products[index].bagWeight = weight;
        saveToLocalStorage();
        renderProducts();
      }
    } else {
      const newId = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random();
      products.push({
        id: newId,
        name: name,
        bagWeight: weight,
        bags: 0,
        looseKg: 0
      });
      saveToLocalStorage();
      renderProducts();
    }
    closeModal();
  }

  function closeModal() {
    document.getElementById('productModal').style.display = 'none';
    currentEditProductId = null;
  }

  function resetAllQuantities() {
    products.forEach(p => {
      p.bags = 0;
      p.looseKg = 0;
    });
    saveToLocalStorage();
    renderProducts();
  }

  function handleNumericInput(e, productId, field) {
    let rawValue = e.target.value;
    let converted = rawValue.replace(/[٠-٩]/g, function(d) {
      return String.fromCharCode(d.charCodeAt(0) - 1632);
    });
    let filtered = converted.replace(/[^0-9.]/g, '');
    let parts = filtered.split('.');
    if (parts.length > 2) {
      filtered = parts[0] + '.' + parts.slice(1).join('');
    }
    
    if (filtered !== e.target.value) {
      e.target.value = filtered;
    }
    
    updateProductQuantity(productId, field, filtered);
  }

  function renderProducts() {
    const container = document.getElementById('productsContainer');
    const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
    let filteredProducts = products.filter(prod => 
      prod.name.toLowerCase().includes(searchTerm) || 
      prod.bagWeight.toString().includes(searchTerm)
    );
    
    if (filteredProducts.length === 0) {
      container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:3rem; background:#11151e; border-radius: 48px;">لا توجد منتجات مطابقة 🔍</div>`;
      return;
    }
    
    container.innerHTML = filteredProducts.map(product => {
      const bagWeight = product.bagWeight;
      const bags = product.bags || 0;
      const looseKg = product.looseKg || 0;
      const totalKg = (bags * bagWeight) + looseKg;
      const decimalBags = bagWeight > 0 ? totalKg / bagWeight : 0;
      const decimalBagsFormatted = decimalBags % 1 === 0 ? decimalBags.toFixed(0) : decimalBags.toFixed(2);
      
      return `
        <div class="product-card" data-product-id="${product.id}">
          <div class="card-header">
            <span class="product-name">${escapeHtml(product.name)}</span>
            <span class="bag-weight-badge">⚖️ الكيس: ${bagWeight} كجم</span>
          </div>
          <div class="input-group">
            <label>📦 عدد الأكياس</label>
            <input type="text" inputmode="decimal" value="${bags}" class="number-input bags-input" data-id="${product.id}" data-field="bags" placeholder="0" autocomplete="off">
          </div>
          <div class="input-group">
            <label>⚖️ كيلو فارط (كجم)</label>
            <input type="text" inputmode="decimal" value="${looseKg}" class="number-input loose-input" data-id="${product.id}" data-field="loose" placeholder="0" autocomplete="off">
          </div>
          <div class="results">
            <div class="result-item">
              <span class="result-label">📊 إجمالي كجم</span>
              <span class="result-value result-total-kg">${Math.round(totalKg * 10) / 10} كجم</span>
            </div>
            <div class="result-item">
              <span class="result-label">🛍️ أكياس عشرية</span>
              <span class="result-value decimal-bags result-decimal-bags">${decimalBagsFormatted} كيس</span>
            </div>
          </div>
          <div class="card-actions">
            <button class="icon-btn edit-btn" data-action="edit" data-id="${product.id}">✏️ تعديل</button>
            <button class="icon-btn delete-btn" data-action="delete" data-id="${product.id}">🗑️ حذف</button>
          </div>
        </div>
      `;
    }).join('');
    
    document.querySelectorAll('.bags-input').forEach(input => {
      const productId = input.getAttribute('data-id');
      input.removeEventListener('input', window[`handler_${productId}_bags`]);
      const handler = (e) => handleNumericInput(e, productId, 'bags');
      window[`handler_${productId}_bags`] = handler;
      input.addEventListener('input', handler);
    });
    
    document.querySelectorAll('.loose-input').forEach(input => {
      const productId = input.getAttribute('data-id');
      input.removeEventListener('input', window[`handler_${productId}_loose`]);
      const handler = (e) => handleNumericInput(e, productId, 'loose');
      window[`handler_${productId}_loose`] = handler;
      input.addEventListener('input', handler);
    });
    
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.removeEventListener('click', handleEditClick);
      btn.addEventListener('click', handleEditClick);
    });
    
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.removeEventListener('click', handleDeleteClick);
      btn.addEventListener('click', handleDeleteClick);
    });
  }
  
  function handleEditClick(e) {
    const id = e.currentTarget.getAttribute('data-id');
    openEditModal(id);
  }
  
  function handleDeleteClick(e) {
    const id = e.currentTarget.getAttribute('data-id');
    if (confirm("هل أنت متأكد من حذف هذا العلف؟")) {
      deleteProductById(id);
    }
  }
  
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
  
  function initSplash() {
    const splashDiv = document.getElementById('splashScreen');
    const closeBtn = document.getElementById('closeSplashBtn');
    if (localStorage.getItem('splash_seen') === 'true') {
      splashDiv.classList.add('hidden');
    } else {
      splashDiv.classList.remove('hidden');
      closeBtn.addEventListener('click', () => {
        splashDiv.classList.add('hidden');
        localStorage.setItem('splash_seen', 'true');
      });
    }
  }
  
  document.addEventListener('DOMContentLoaded', () => {
    loadProductsFromStorage();
    renderProducts();
    initSplash();
    
    document.getElementById('addProductBtn').addEventListener('click', openAddModal);
    document.getElementById('resetQuantitiesBtn').addEventListener('click', () => {
      if(confirm("إعادة تعيين جميع الكميات إلى صفر؟")) {
        resetAllQuantities();
      }
    });
    document.getElementById('modalSaveBtn').addEventListener('click', saveProductFromModal);
    document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
    document.getElementById('searchInput').addEventListener('input', () => renderProducts());
    
    // ربط زر الواتساب
    document.getElementById('sendWhatsAppBtn').addEventListener('click', sendWhatsAppReport);
    
    window.addEventListener('click', (e) => {
      if (e.target === document.getElementById('productModal')) closeModal();
    });
  });
  
  window.addEventListener('storage', (e) => {
    if (e.key === 'feed_manager_products') {
      loadProductsFromStorage();
      renderProducts();
    }
  });
</script>
</body>
</html>
